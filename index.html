<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trace Uniswap v4 hook permissions, code paths, and simulated pool behavior in your browser." />
    <meta name="application-name" content="Hookscope" />
    <meta name="apple-mobile-web-app-title" content="Hookscope" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#171714" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hookscope" />
    <meta property="og:title" content="Hookscope — Uniswap v4 hook analyzer" />
    <meta property="og:description" content="Trace hook permissions, code paths, and simulated pool behavior directly in your browser." />
    <meta property="og:image" content="/brand/hookscope-transparent-v2-1024.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/brand/hookscope-transparent-v2-1024.png" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('hookscope.theme.v1')
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#11120f' : '#ffffff'
        } catch {
          const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        }
      })()
    </script>
    <script>
      (() => {
        // An open tab can outlive a deployment. Its entry bundle may then ask
        // the new deployment for an old lazy chunk that no longer exists.
        // Vite emits this event before rejecting the dynamic import, giving us
        // one safe opportunity to move the tab onto the current asset manifest.
        const recoveryParameter = '__hookscope_asset_reload'
        const loadedUrl = new URL(location.href)
        const recoveredEntry = loadedUrl.searchParams.get(recoveryParameter)
        if (recoveredEntry) {
          loadedUrl.searchParams.delete(recoveryParameter)
          history.replaceState(history.state, '', loadedUrl)
        }

        window.addEventListener('vite:preloadError', (event) => {
          const entry = Array.from(document.scripts)
            .find((script) => script.type === 'module' && script.src)?.src
          if (!entry || recoveredEntry === entry) return
          event.preventDefault()
          const next = new URL(location.href)
          next.searchParams.set(recoveryParameter, entry)
          location.replace(next)
        })
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/hookscope-transparent-v2-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/hookscope-transparent-v2-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/hookscope-transparent-v2-180.png" />
    <title>Hookscope — Uniswap v4 hook analyzer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
